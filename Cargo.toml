[workspace]
members = [
    "crates/findex-core",
    "crates/findex-index",
    "crates/findex-mcp",
    "crates/findex-watch",
    "crates/findex-syntax",
    "crates/findex-cli",
    "crates/findex-relations",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/brutalstein/findex"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
