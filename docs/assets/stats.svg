<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 156" role="img" aria-labelledby="t d">
  <title id="t">Findex in four numbers</title>
  <desc id="d">0.982 right definition on the first try in 55 new held-out lookups. 23.7 percent fewer Claude tokens on navigation tasks with Haiku 4.5, 12 of 12 correct. 279 of 279 coverage claims hold against git grep. 0 cloud-only files downloaded by indexing.</desc>
  <style>
    .tile{fill:#f3f2ee;stroke:#e1e0d9}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#898781}.acc{fill:#2a78d6}
    @media (prefers-color-scheme: dark){
      .tile{fill:#232321;stroke:#2c2c2a}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}.acc{fill:#3987e5}
    }
    text{font-family:Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif}
  </style>
  <g>
    <rect class="tile" x="0.5" y="0.5" width="205" height="155" rx="14"/>
    <rect class="acc" x="18" y="18" width="28" height="4" rx="2"/>
    <text class="ink" x="18" y="70" font-size="34" font-weight="750">0.982</text>
    <text class="ink2" x="18" y="98" font-size="13">right definition,</text>
    <text class="ink2" x="18" y="116" font-size="13">first try</text>
    <text class="muted" x="18" y="138" font-size="11">55 new held-out lookups</text>
  </g>
  <g transform="translate(225 0)">
    <rect class="tile" x="0.5" y="0.5" width="205" height="155" rx="14"/>
    <rect class="acc" x="18" y="18" width="28" height="4" rx="2"/>
    <text class="ink" x="18" y="70" font-size="34" font-weight="750">−23.7%</text>
    <text class="ink2" x="18" y="98" font-size="13">Claude tokens on</text>
    <text class="ink2" x="18" y="116" font-size="13">navigation tasks</text>
    <text class="muted" x="18" y="138" font-size="11">Haiku 4.5 · 12/12 correct</text>
  </g>
  <g transform="translate(450 0)">
    <rect class="tile" x="0.5" y="0.5" width="205" height="155" rx="14"/>
    <rect class="acc" x="18" y="18" width="28" height="4" rx="2"/>
    <text class="ink" x="18" y="70" font-size="34" font-weight="750">279/279</text>
    <text class="ink2" x="18" y="98" font-size="13">“every occurrence”</text>
    <text class="ink2" x="18" y="116" font-size="13">claims that hold</text>
    <text class="muted" x="18" y="138" font-size="11">checked against git grep</text>
  </g>
  <g transform="translate(674 0)">
    <rect class="tile" x="0.5" y="0.5" width="205" height="155" rx="14"/>
    <rect class="acc" x="18" y="18" width="28" height="4" rx="2"/>
    <text class="ink" x="18" y="70" font-size="34" font-weight="750">0</text>
    <text class="ink2" x="18" y="98" font-size="13">cloud-only files</text>
    <text class="ink2" x="18" y="116" font-size="13">downloaded by indexing</text>
    <text class="muted" x="18" y="138" font-size="11">OneDrive Files On-Demand</text>
  </g>
</svg>
