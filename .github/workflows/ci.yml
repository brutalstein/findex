name: CI / Windows Native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Format, Clippy, Tests, Release Build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
      - name: Rust stable with toolchain components
        shell: pwsh
        run: |
          rustup default stable
          rustup component add rustfmt clippy
      - name: Verify locked dependency resolution
        shell: pwsh
        run: |
          if (-not (Test-Path Cargo.lock)) { throw "Cargo.lock must be committed" }
          cargo metadata --locked --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Cargo.lock drift detected" }
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test --locked --workspace --all-targets
      - name: Graph adversarial regression focus
        shell: pwsh
        run: |
          cargo test --locked -p findex-relations --all-targets -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Graph security regression suite failed" }
      - name: Build optimized native CLI
        run: cargo build --locked --release -p findex
      - name: Verify native executable and CLI
        shell: pwsh
        run: |
          .\target\release\findex.exe --version
          .\target\release\findex.exe help
          .\target\release\findex.exe doctor
      - name: MCP protocol and lexical search smoke
        shell: pwsh
        run: |
          $messages = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}'
            '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          ) -join "`n"
          $responses = $messages | .\target\release\findex.exe mcp
          if ($LASTEXITCODE -ne 0) { throw "MCP server exited unsuccessfully" }
          $parsed = @($responses | ForEach-Object { $_ | ConvertFrom-Json })
          if ($parsed.Count -ne 2) { throw "Expected exactly two MCP responses" }
          if ($parsed[0].result.serverInfo.name -ne 'findex') { throw "MCP init mismatch" }
          if ($parsed[1].result.tools[0].name -ne 'findex_search') { throw "MCP tools/list mismatch" }
          .\target\release\findex.exe index
          .\target\release\findex.exe search findex_search
          if ($LASTEXITCODE -ne 0) { throw "Lexical search failed" }
      - name: Assert warmed MCP search avoids full workspace reconciliation
        shell: pwsh
        run: |
          $messages = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}'
            '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"findex_search","arguments":{"query":"findex_search","limit":3}}}'
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"findex_search","arguments":{"query":"findex_search","limit":3}}}'
          ) -join "`n"
          $responses = $messages | .\\target\\release\\findex.exe mcp
          if ($LASTEXITCODE -ne 0) { throw "MCP search process failed" }
          $parsed = @($responses | ForEach-Object { $_ | ConvertFrom-Json })
          $initialCall = @($parsed | Where-Object { $_.id -eq 2 })
          $warmCall = @($parsed | Where-Object { $_.id -eq 3 })
          if ($initialCall.Count -ne 1 -or $warmCall.Count -ne 1) {
            throw "Expected exactly two MCP search responses"
          }
          $first = $initialCall[0].result.content[0].text | ConvertFrom-Json
          $second = $warmCall[0].result.content[0].text | ConvertFrom-Json
          if ($first.hits.Count -eq 0 -or $second.hits.Count -eq 0) {
            throw "Expected real lexical search hits"
          }
          if ($second.retrieval -ne "sqlite-fts5-bm25-native-watch") {
            throw "Watcher-backed MCP path not selected"
          }
          if ($second.sync.examined -ne 0) {
            throw "Warm query unexpectedly walked workspace ($($second.sync.examined) files)"
          }
      - name: Verify four-language native symbol extraction
        shell: pwsh
        run: |
          $result = .\\target\\release\\findex.exe symbols crates\\findex-watch\\src\\lib.rs
          if ($LASTEXITCODE -ne 0) { throw "Native syntax inspection failed" }
          if (-not ($result -match "WatchedIndex")) { throw "Expected Rust definition missing" }
      - name: Verify persistent exact-name symbol lookup
        shell: pwsh
        run: |
          $result = .\\target\\release\\findex.exe find-symbol WatchedIndex
          if ($LASTEXITCODE -ne 0) { throw "Symbol index lookup failed" }
          if (-not ($result -match 'findex-watch')) { throw "Symbol index lookup missing expected source span" }
          $second = .\\target\\release\\findex.exe find-symbol WatchedIndex
          if ($LASTEXITCODE -ne 0 -or -not ($second -match 'WatchedIndex')) { throw "Cached symbol lookup failed" }
      - name: Verify warmed MCP persistent symbol lookup avoids full scan
        shell: pwsh
        run: |
          $messages = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}'
            '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"findex_find_symbol","arguments":{"name":"WatchedIndex","limit":3}}}'
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"findex_find_symbol","arguments":{"name":"WatchedIndex","limit":3}}}'
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"findex_symbols","arguments":{"path":"crates/findex-watch/src/lib.rs"}}}'
          ) -join "`n"
          $responses = $messages | .\\target\\release\\findex.exe mcp
          if ($LASTEXITCODE -ne 0) { throw "MCP process failed" }
          $parsed = @($responses | ForEach-Object { $_ | ConvertFrom-Json })
          $firstCall = @($parsed | Where-Object { $_.id -eq 2 })
          $secondCall = @($parsed | Where-Object { $_.id -eq 3 })
          $inspectCall = @($parsed | Where-Object { $_.id -eq 4 })
          if ($firstCall.Count -ne 1 -or $secondCall.Count -ne 1 -or $inspectCall.Count -ne 1) {
            throw "Expected symbol lookup and AST inspection responses"
          }
          $first = $firstCall[0].result.content[0].text | ConvertFrom-Json
          $second = $secondCall[0].result.content[0].text | ConvertFrom-Json
          $inspection = $inspectCall[0].result.content[0].text | ConvertFrom-Json
          if ($first.hits.Count -lt 1 -or $second.hits.Count -lt 1) {
            throw "Persistent symbol search returned no verified evidence"
          }
          if ($second.retrieval -ne 'sqlite-symbol-exact-hash-native-watch' -or $second.sync.examined -ne 0) {
            throw "Warm exact symbol lookup unexpectedly performed a full project scan"
          }
          if ($inspectCall[0].result.isError -or $inspection.symbols.Count -lt 1) {
            throw "Shared MCP watcher-backed AST inspection failed"
          }
      - name: End-to-end reference graph and MCP impact smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-impact-fixture | Out-Null
          Set-Content ci-impact-fixture/definition.rs 'fn semantic_marker() {}'
          Set-Content ci-impact-fixture/reference.rs 'fn user() { semantic_marker(); }'
          $capture = '{"definition":{"path":"ci-impact-fixture/definition.rs","line":0,"character":3},"references":[{"path":"ci-impact-fixture/reference.rs","line":0,"character":12}]}'
          Set-Content -Path ci-impact-fixture/captured.json -Value $capture
          .\\target\\release\\findex.exe graph-import-lsp ci-impact-fixture/captured.json
          if ($LASTEXITCODE -ne 0) { throw "LSP snapshot ingestion failed" }
          $affected = .\\target\\release\\findex.exe impact ci-impact-fixture/definition.rs
          if ($LASTEXITCODE -ne 0 -or -not ($affected -match 'ci-impact-fixture/reference.rs')) {
            throw "Verified semantic impact edge missing"
          }
          $call = '{"jsonrpc":"2.0","id":9,"method":"tools/call","params":{"name":"findex_impact","arguments":{"path":"ci-impact-fixture/definition.rs","depth":1}}}'
          $reply = $call | .\\target\\release\\findex.exe mcp | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $reply.result.isError) {
            throw "MCP graph impact failed"
          }
          $result = $reply.result.content[0].text | ConvertFrom-Json
          if ($result.hits.Count -ne 1 -or $result.hits[0].path -ne 'ci-impact-fixture/reference.rs') {
            throw "MCP impact emitted unexpected evidence"
          }
          Remove-Item -Recurse -Force ci-impact-fixture
      - name: Package Findex and bundled Claude plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\findex | Out-Null
          Copy-Item target\release\findex.exe dist\findex\findex.exe
          Copy-Item -Recurse plugin dist\findex\plugin
          Copy-Item README.md, LICENSE, Cargo.lock dist\findex\
          python validation/harness/sbom.py dist\findex\sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { throw 'SBOM generation failed' }
          "git-commit=$env:GITHUB_SHA" | Set-Content dist\findex\BUILD-INFO.txt
          "rustc=$(rustc --version)" | Add-Content dist\findex\BUILD-INFO.txt
          "cargo=$(cargo --version)" | Add-Content dist\findex\BUILD-INFO.txt
          Compress-Archive -Path dist\findex -DestinationPath dist\findex-windows-x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist\findex-windows-x64.zip).Hash.ToLowerInvariant()
          "$hash  findex-windows-x64.zip" | Set-Content -Encoding utf8 dist\findex-windows-x64.sha256
          Write-Output "Findex ZIP SHA256: $hash"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: findex-windows-x64
          path: |
            dist/findex-windows-x64.zip
            dist/findex-windows-x64.sha256
          if-no-files-found: error
          retention-days: 14
      # Pull requests (including forks) get no id-token; attest pushes to main and manual runs.
      - name: Attest build provenance of the release ZIP
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/findex-windows-x64.zip

  supply-chain:
    name: RustSec advisory audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock against the RustSec database
        run: cargo audit --deny warnings

  msrv:
    name: Windows Rust 1.85 minimum toolchain
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
      - name: Install declared minimum Rust version
        shell: pwsh
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 --version
          rustc +1.85.0 --version
      - name: Compile all workspace targets at MSRV
        run: cargo +1.85.0 check --locked --workspace --all-targets
      - name: Run all regression tests on declared MSRV
        run: cargo +1.85.0 test --locked --workspace --all-targets
