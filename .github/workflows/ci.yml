name: CI / Windows Native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Format, Clippy, Tests, Release Build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
      - name: Rust stable with toolchain components
        shell: pwsh
        run: |
          rustup default stable
          rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace --all-targets
      - name: Build optimized native CLI
        run: cargo build --release -p findex
      - name: Verify native executable and CLI
        shell: pwsh
        run: |
          .\target\release\findex.exe --version
          .\target\release\findex.exe help
          .\target\release\findex.exe doctor
      - name: MCP protocol and lexical search smoke
        shell: pwsh
        run: |
          $messages = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}'
            '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          ) -join "`n"
          $responses = $messages | .\target\release\findex.exe mcp
          if ($LASTEXITCODE -ne 0) { throw "MCP server exited unsuccessfully" }
          $parsed = @($responses | ForEach-Object { $_ | ConvertFrom-Json })
          if ($parsed.Count -ne 2) { throw "Expected exactly two MCP responses" }
          if ($parsed[0].result.serverInfo.name -ne 'findex') { throw "MCP init mismatch" }
          if ($parsed[1].result.tools[0].name -ne 'findex_search') { throw "MCP tools/list mismatch" }
          .\target\release\findex.exe index
          .\target\release\findex.exe search findex_search
          if ($LASTEXITCODE -ne 0) { throw "Lexical search failed" }
      - name: Assert warmed MCP search avoids full workspace reconciliation
        shell: pwsh
        run: |
          $messages = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}'
            '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"findex_search","arguments":{"query":"findex_search","limit":3}}}'
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"findex_search","arguments":{"query":"findex_search","limit":3}}}'
          ) -join "`n"
          $responses = $messages | .\\target\\release\\findex.exe mcp
          if ($LASTEXITCODE -ne 0) { throw "MCP search process failed" }
          $parsed = @($responses | ForEach-Object { $_ | ConvertFrom-Json })
          $initialCall = @($parsed | Where-Object { $_.id -eq 2 })
          $warmCall = @($parsed | Where-Object { $_.id -eq 3 })
          if ($initialCall.Count -ne 1 -or $warmCall.Count -ne 1) {
            throw "Expected exactly two MCP search responses"
          }
          $first = $initialCall[0].result.content[0].text | ConvertFrom-Json
          $second = $warmCall[0].result.content[0].text | ConvertFrom-Json
          if ($first.hits.Count -eq 0 -or $second.hits.Count -eq 0) {
            throw "Expected real lexical search hits"
          }
          if ($second.retrieval -ne "sqlite-fts5-bm25-native-watch") {
            throw "Watcher-backed MCP path not selected"
          }
          if ($second.sync.examined -ne 0) {
            throw "Warm query unexpectedly walked workspace ($($second.sync.examined) files)"
          }
      - name: Verify four-language native symbol extraction
        shell: pwsh
        run: |
          $result = .\\target\\release\\findex.exe symbols crates\\findex-watch\\src\\lib.rs
          if ($LASTEXITCODE -ne 0) { throw "Native syntax inspection failed" }
          if (-not ($result -match "WatchedIndex")) { throw "Expected Rust definition missing" }
      - name: Verify persistent exact-name symbol lookup
        shell: pwsh
        run: |
          $result = .\\target\\release\\findex.exe find-symbol WatchedIndex
          if ($LASTEXITCODE -ne 0) { throw "Symbol index lookup failed" }
          if (-not ($result -match 'findex-watch')) { throw "Symbol index lookup missing expected source span" }
          $second = .\\target\\release\\findex.exe find-symbol WatchedIndex
          if ($LASTEXITCODE -ne 0 -or -not ($second -match 'WatchedIndex')) { throw "Cached symbol lookup failed" }
      - name: Package Findex and bundled Claude plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\findex | Out-Null
          Copy-Item target\release\findex.exe dist\findex\findex.exe
          Copy-Item -Recurse plugin dist\findex\plugin
          Copy-Item README.md, LICENSE dist\findex\
          Compress-Archive -Path dist\findex -DestinationPath dist\findex-windows-x64.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: findex-windows-x64
          path: dist/findex-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
