name: One-time Rustfmt Cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-once.yml
permissions:
  contents: write
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rustfmt
        run: rustup component add rustfmt
      - name: Format tracked Rust sources
        run: cargo fmt --all
      - name: Commit formatting only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- crates/
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply official rustfmt to native workspace'
            git push origin HEAD:main
          fi
