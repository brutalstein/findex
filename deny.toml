# Supply-chain policy, checked in CI with `cargo deny check licenses bans sources`.
# Security advisories are checked separately by `cargo audit` (RustSec).

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[licenses]
# Permissive licenses only; a new license needs a reviewed change here.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Internal path dependencies of this workspace are not wildcards in practice.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
